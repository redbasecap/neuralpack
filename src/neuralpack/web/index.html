<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>npk viewer</title>
<style>
  :root { --bg: #0f1115; --fg: #e8e8ea; --muted: #9aa0a6; --card: #181b22; --accent: #5ad1ff; --ok: #6ee7a8; --bad: #ff7b7b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, system-ui, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 20px 24px 8px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  header .tag { color: var(--muted); font-size: 13px; }
  main { padding: 8px 24px 32px; display: grid; gap: 16px; grid-template-columns: minmax(280px, 360px) 1fr; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border-radius: 12px; padding: 16px; }
  .drop { border: 2px dashed #3a4150; border-radius: 12px; padding: 28px 16px; text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--accent); background: #1b2230; color: var(--fg); }
  .drop input { display: none; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid #242a35; font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row b { font-weight: 600; }
  .muted { color: var(--muted); }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  #log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; max-height: 220px; overflow: auto; color: var(--muted); margin: 0; }
  #stage { display: grid; place-items: center; min-height: 320px; }
  canvas { max-width: 100%; height: auto; border-radius: 8px; background: #000; image-rendering: auto; }
  .bar { height: 6px; background: #242a35; border-radius: 3px; overflow: hidden; margin: 10px 0 0; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  button, a.btn { background: #232a38; color: var(--fg); border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; text-decoration: none; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  select { background: #232a38; color: var(--fg); border: 0; border-radius: 8px; padding: 6px 8px; font: inherit; }
</style>
</head>
<body>
<header>
  <h1>npk viewer</h1>
  <span class="tag">neural image decoding in your browser · nothing is uploaded</span>
</header>
<main>
  <section class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".npk,image/*" multiple>
      <div><b>Drop an .npk file</b> here or click to choose.<br><span class="muted">Optional: also drop the original image to measure PSNR.</span></div>
    </label>
    <div class="bar"><i id="bar"></i></div>
    <div style="margin-top:12px" id="info">
      <div class="row"><span class="muted">Compute</span><span id="compute">…</span></div>
      <div class="row"><span class="muted">Model</span><span id="model">–</span></div>
      <div class="row"><span class="muted">Picture</span><span id="dims">–</span></div>
      <div class="row"><span class="muted">File</span><span id="bytes">–</span></div>
      <div class="row"><span class="muted">Decoded in</span><span id="time">–</span></div>
      <div class="row"><span class="muted">PSNR vs original</span><span id="psnr">–</span></div>
    </div>
    <div class="actions">
      <button id="save" disabled>Save PNG</button>
      <select id="hyperMode"><option value="auto">hyper-synthesis: auto</option><option value="gpu">WebGPU</option><option value="cpu">CPU (slow)</option></select>
    </div>
    <pre id="log" style="margin-top:12px"></pre>
  </section>
  <section class="card" id="stage"><span class="muted">The decoded picture appears here.</span></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.min.js"></script>
<script type="module">
import { parseNpk, tileGrid, tablesFromJson, decodeTileLatents, IntHyperCPU, padTo } from "./npk.js";
import { IntHyperGPU } from "./gpu.js";

const $ = (id) => document.getElementById(id);
const log = (m, cls) => { const l = $("log"); l.textContent += (l.textContent ? "\n" : "") + m; l.scrollTop = l.scrollHeight; if (cls) console.log(m); };
const MODELS_URL = new URL("models/", location.href);
const modelCache = new Map();
let reference = null, lastDecoded = null;

ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/";

async function fetchJson(u) { const r = await fetch(u); if (!r.ok) throw new Error(`${u}: HTTP ${r.status}`); return r.json(); }

async function loadModel(dirName, header) {
  if (modelCache.has(dirName)) return modelCache.get(dirName);
  const base = new URL(dirName + "/", MODELS_URL);
  log(`loading prior ${dirName} …`);
  const manifest = await fetchJson(new URL("manifest.json", base));
  if (manifest.fingerprint !== header.fingerprint) throw new Error(`model fingerprint ${manifest.fingerprint.toString(16)} does not match the file's ${header.fingerprint.toString(16)}`);
  const [tables, hyper, wBuf] = await Promise.all([
    fetchJson(new URL(manifest.files.tables, base)), fetchJson(new URL(manifest.files.hyper, base)),
    fetch(new URL(manifest.files.weights, base)).then((r) => r.arrayBuffer())]);
  const weights = new Int16Array(wBuf);
  let gpu = null, gpuErr = null;
  const mode = $("hyperMode").value;
  if (mode !== "cpu") { try { gpu = await IntHyperGPU.create(hyper, weights); } catch (e) { gpuErr = e; } }
  if (!gpu && mode === "gpu") throw gpuErr || new Error("WebGPU unavailable");
  const cpu = new IntHyperCPU(hyper, weights);
  const providers = gpu ? ["webgpu", "wasm"] : ["wasm"];
  const session = await ort.InferenceSession.create(new URL(manifest.files.g_s, base).href, { executionProviders: providers, graphOptimizationLevel: "all" });
  $("compute").textContent = (gpu ? "WebGPU" : "CPU/WASM" + (gpuErr ? ` (${gpuErr.message})` : ""));
  const m = { manifest, tables: tablesFromJson(tables), hyper, gpu, cpu, session };
  modelCache.set(dirName, m);
  log(`prior ready: ${manifest.model} q${manifest.quality}, g_s via ${session.handler?.sessionOptions?.executionProviders?.[0] ?? providers[0]}`);
  return m;
}

async function runGs(model, yHat, hy, wy) {
  const M = model.manifest.n_latent;
  const feeds = { y_hat: new ort.Tensor("float32", yHat, [1, M, hy, wy]) };
  const out = await model.session.run(feeds);
  return out.x_hat; // (1,3,16hy,16wy)
}

async function decode(buffer, name) {
  const t0 = performance.now();
  const { header, tiles } = parseNpk(buffer);
  if (!header.intHyper) throw new Error("this file was written without the integer hyper-synthesis (npk encode --no-web); it can only be opened with the Python decoder");
  const index = await fetchJson(new URL("index.json", MODELS_URL));
  const entry = index.find((e) => e.model_id === header.modelId && e.quality === header.quality);
  if (!entry) throw new Error(`no exported prior for model id ${header.modelId} quality ${header.quality} (run: npk export-web)`);
  $("model").textContent = `${entry.model} q${header.quality}`;
  $("dims").textContent = `${header.width} × ${header.height} (${(header.width * header.height / 1e6).toFixed(1)} MP), ${tiles.length} tile${tiles.length > 1 ? "s" : ""}`;
  $("bytes").textContent = `${(buffer.byteLength / 1e3).toFixed(1)} kB · ${(buffer.byteLength * 8 / (header.width * header.height)).toFixed(3)} bpp`;
  const model = await loadModel(entry.dir, header);
  const grid = tileGrid(header.width, header.height, header.tile, header.overlap);
  const canvas = document.createElement("canvas");
  canvas.width = header.width; canvas.height = header.height;
  $("stage").replaceChildren(canvas);
  const ctx = canvas.getContext("2d");
  const stats = { z: 0, hyper: 0, y: 0, gs: 0 };
  const hyperRun = model.gpu ? (a, h, w) => model.gpu.run(a, h, w) : async (a, h, w) => model.cpu.run(a, h, w);
  for (let i = 0; i < grid.length; i++) {
    const t = grid[i], eh = t.ey1 - t.ey0, ew = t.ex1 - t.ex0;
    const { yHat, hy, wy } = await decodeTileLatents(tiles[i], eh, ew, model.tables, model.hyper, hyperRun, stats);
    const tg = performance.now();
    const x = await runGs(model, yHat, hy, wy);
    stats.gs += performance.now() - tg;
    const W = wy * 16, H = hy * 16, plane = H * W, d = x.data;
    const cw = t.x1 - t.x0, ch = t.y1 - t.y0, left = t.x0 - t.ex0, top = t.y0 - t.ey0;
    const img = ctx.createImageData(cw, ch);
    for (let yy = 0; yy < ch; yy++) for (let xx = 0; xx < cw; xx++) {
      const si = (yy + top) * W + (xx + left), di = (yy * cw + xx) * 4;
      img.data[di] = clamp255(d[si]); img.data[di + 1] = clamp255(d[plane + si]); img.data[di + 2] = clamp255(d[2 * plane + si]); img.data[di + 3] = 255;
    }
    if (header.grayscale) for (let p = 0; p < img.data.length; p += 4) { const g = Math.round(0.299 * img.data[p] + 0.587 * img.data[p + 1] + 0.114 * img.data[p + 2]); img.data[p] = img.data[p + 1] = img.data[p + 2] = g; }
    ctx.putImageData(img, t.x0, t.y0);
    $("bar").style.width = `${(100 * (i + 1)) / grid.length}%`;
    await new Promise((r) => setTimeout(r, 0));
  }
  const total = performance.now() - t0;
  $("time").textContent = `${(total / 1000).toFixed(2)} s  (entropy ${((stats.z + stats.y) / 1000).toFixed(2)} · hyper ${(stats.hyper / 1000).toFixed(2)} · g_s ${(stats.gs / 1000).toFixed(2)})`;
  log(`decoded ${name}: ${header.width}x${header.height} in ${(total / 1000).toFixed(2)} s`);
  lastDecoded = { canvas, name };
  $("save").disabled = false;
  updatePsnr();
}

function clamp255(v) { const x = Math.round(v * 255); return x < 0 ? 0 : x > 255 ? 255 : x; }

function updatePsnr() {
  if (!reference || !lastDecoded) return;
  const c = lastDecoded.canvas;
  if (reference.width !== c.width || reference.height !== c.height) { $("psnr").textContent = "size mismatch"; return; }
  const a = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
  const b = reference.getContext("2d").getImageData(0, 0, c.width, c.height).data;
  let se = 0, n = 0;
  for (let i = 0; i < a.length; i += 4) { for (let k = 0; k < 3; k++) { const d = a[i + k] - b[i + k]; se += d * d; } n += 3; }
  const mse = se / n;
  $("psnr").textContent = mse === 0 ? "∞ dB" : `${(10 * Math.log10(255 * 255 / mse)).toFixed(2)} dB`;
  $("psnr").className = "ok";
}

async function handleFiles(files) {
  for (const f of files) {
    if (/\.npk$/i.test(f.name)) {
      $("bar").style.width = "0%"; $("psnr").textContent = reference ? "…" : "–"; $("save").disabled = true;
      try { await decode(await f.arrayBuffer(), f.name); }
      catch (e) { log(`error: ${e.message}`); $("stage").replaceChildren(Object.assign(document.createElement("span"), { className: "bad", textContent: e.message })); console.error(e); }
    } else if (f.type.startsWith("image/")) {
      const bmp = await createImageBitmap(f);
      const c = document.createElement("canvas"); c.width = bmp.width; c.height = bmp.height;
      c.getContext("2d").drawImage(bmp, 0, 0);
      reference = c; log(`reference image ${f.name} (${bmp.width}x${bmp.height}) loaded`);
      updatePsnr();
    }
  }
}

const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); handleFiles(e.dataTransfer.files); });
$("file").addEventListener("change", (e) => handleFiles(e.target.files));
$("save").addEventListener("click", () => { const a = document.createElement("a"); a.download = lastDecoded.name.replace(/\.npk$/i, "") + ".png"; a.href = lastDecoded.canvas.toDataURL("image/png"); a.click(); });
$("hyperMode").addEventListener("change", () => modelCache.clear());
$("compute").textContent = navigator.gpu ? "WebGPU available" : "no WebGPU: CPU fallback";
// expose for automated tests
window.npkDecodeArrayBuffer = (buf, name) => decode(buf, name || "test.npk");
window.npkLastCanvas = () => lastDecoded?.canvas;
log("ready. models from " + MODELS_URL.href);
</script>
</body>
</html>
